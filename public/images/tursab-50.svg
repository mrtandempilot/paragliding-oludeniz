<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 110" width="320" height="110">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#C8960C;stop-opacity:1" />
      <stop offset="40%" style="stop-color:#F5D060;stop-opacity:1" />
      <stop offset="70%" style="stop-color:#D4A017;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8B6914;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="320" height="110" fill="white" rx="4"/>

  <!-- "5" numeral -->
  <text x="10" y="88" font-family="Arial Black, sans-serif" font-size="90" font-weight="900" fill="url(#goldGrad)">5</text>

  <!-- "0" arc (C shape) - drawn as arc path -->
  <path d="M 100 15
             A 38 38 0 1 1 100 95"
        fill="none" stroke="url(#goldGrad)" stroke-width="14" stroke-linecap="round"/>

  <!-- Turkey map (simplified silhouette in red) -->
  <g transform="translate(145, 28) scale(0.38)">
    <path d="M10,30 L30,20 L50,18 L70,22 L90,18 L110,20 L130,15 L150,18 L170,20 L190,18 L200,25 L195,35 L180,38 L170,45 L155,42 L140,48 L120,45 L100,50 L80,52 L65,48 L50,55 L35,50 L20,45 L8,40 Z"
          fill="#cc0000"/>
  </g>

  <!-- Horizontal lines -->
  <line x1="143" y1="36" x2="162" y2="36" stroke="#999" stroke-width="2"/>
  <line x1="143" y1="42" x2="162" y2="42" stroke="#999" stroke-width="2"/>
  <line x1="228" y1="36" x2="310" y2="36" stroke="#999" stroke-width="2"/>
  <line x1="228" y1="42" x2="310" y2="42" stroke="#999" stroke-width="2"/>

  <!-- TÜRSAB text -->
  <text x="163" y="90" font-family="Arial Black, Impact, sans-serif" font-size="52" font-weight="900" fill="#cc0000" letter-spacing="1">TÜRSAB</text>
</svg>
